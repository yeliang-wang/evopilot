schema: evopilot-harness-template/v1
id: api-gateway-harness
version: 2.0.0
name: API Gateway Harness
description: Domain baseline for API gateway products.
scope: platform
languageFamily: generic
capabilities:
  - id: source-boundary
    name: Source and workspace boundary
    boundary: Project source, credentials, tenant, workspace, branch, writeback, and read-only mode are explicit before execution.
    requiredEvidence: [project-registration, source-readiness-preflight, credential-or-read-only-boundary]
  - id: api-gateway-runtime
    name: API gateway runtime harness
    boundary: Gateway boot, config validation, routing, policy, plugin, protocol, load, and readiness commands are declared.
    requiredEvidence: [config-validation-output, route-contract-output, policy-output, plugin-output, load-output]
  - id: gateway-traffic-boundary
    name: Gateway traffic boundary
    boundary: Listener, route matching, upstream selection, retry, circuit breaker, rate limit, auth, and traffic shadowing are explicit.
    requiredEvidence: [route-table-proof, upstream-selection-proof, retry-policy-proof, rate-limit-proof, auth-policy-proof]
  - id: gateway-extension-boundary
    name: Gateway extension boundary
    boundary: Plugin and filter lifecycle, configuration schema, failure isolation, hot reload, and compatibility behavior are governed.
    requiredEvidence: [plugin-contract, filter-lifecycle-test, hot-reload-proof, extension-failure-proof]
  - id: exception-tracking
    name: Exception and error tracking
    boundary: Runtime exceptions, domain errors, dependency failures, retries, and user-facing errors are classified and correlated.
    requiredEvidence: [error-code-contract, exception-sample, trace-link, owner-next-action, repair-verification]
  - id: test-and-quality
    name: Test and quality gates
    boundary: Tests, coverage expectations, interface contracts, and regression scope are proven through command evidence.
    requiredEvidence: [test-report, coverage-or-risk-acceptance, contract-check]
  - id: failure-diagnostics
    name: Failure diagnostics
    boundary: Failures are classified with command, stack/log excerpt, suspected root cause, owner, next action, and verification.
    requiredEvidence: [failure-classification, root-cause-note, repair-verification]
  - id: observability
    name: Observability
    boundary: Health, readiness, logs, metrics, traces, APM signals, and alert routes are bound before Beta/RC/GA claims.
    requiredEvidence: [health-check, runtime-log, metric-or-trace-proof, alert-route]
  - id: slo-monitoring
    name: SLO monitoring and alert routing
    boundary: SLIs, SLOs, dashboards, alert thresholds, routing targets, and error budget status are explicit before RC/GA.
    requiredEvidence: [sli-definition, slo-dashboard, alert-rule, runbook-link, error-budget-status]
  - id: operational-runbooks
    name: Operational runbooks
    boundary: Critical failure modes have symptom-first runbooks with triage queries, mitigation, rollback, owner, and verification.
    requiredEvidence: [runbook, triage-query, rollback-or-mitigation, oncall-owner, post-repair-verification]
  - id: release-governance
    name: Release governance
    boundary: TargetEvidencePackage, PhasePackage, source closure, release evidence, and ReleaseDecision are required before GA.
    requiredEvidence: [target-evidence-package, phase-package, source-closure, release-decision]
runtimePatterns:
  harnessLayer: domain
  domain: api-gateway
  domainLabel: API gateway product
  language: generic
  compatibilityProfiles:
    - id: http-gateway
      role: protocol-baseline
      scope: [http1, http2, websocket, grpc]
    - id: ingress-compatible
      role: ecosystem-compatibility
      scope: [kubernetes-ingress, gateway-api, service-discovery]
    - id: envoy-compatible
      role: behavioral-reference
      scope: [xds, filter-chain, traffic-policy]
  architectureProfiles:
    - id: edge-gateway
      concerns: [tls, waf, auth, rate-limit, observability]
    - id: service-mesh-gateway
      concerns: [xds, sidecar, mtls, traffic-split, policy]
    - id: multi-tenant-gateway
      concerns: [tenant-isolation, plugin-governance, quota, audit]
  runtimeProfiles: [go, rust, java, node, generic]
  architectureStyles: [api-gateway, ingress-controller, traffic-proxy, service-mesh-gateway, plugin-platform]
  defaultCommands:
    install: [make deps]
    lint: [make lint]
    typecheck: [make build]
    unit: [make test-unit]
    smoke: [make smoke-gateway]
    functional: [make test-routes, make test-policy, make test-load]
validationBaseline:
  requiredCommandGroups: [install, lint, typecheck, unit, smoke, functional]
  requiredBoundaries: [routing, upstream, auth-policy, rate-limit, plugin, protocol, observability]
  contractChecks: [route-contract, policy-contract, plugin-contract, protocol-compatibility, load-regression]
  commandEvidenceRequired: true
  realBoundaryEvidenceRequired: true
  noMockEvidenceForReleaseClaims: true
evidenceContract:
  format: json
  requiredArtifacts: [target-evidence-package, phase-package, goal-completion-report, route-table, policy-matrix, plugin-report]
failureTaxonomy:
  categories: [routing, upstream, policy, plugin, protocol, load, observability, governance, unknown]
diagnosticsBaseline:
  requiredSignals: [failing-command, exit-code, route-id, upstream-id, policy-id, plugin-id, trace-id, load-summary]
observabilityBaseline:
  requiredSignals: [health, readiness, logs, metrics, traces, alerts, dashboards, slo, runbooks]
governanceRules:
  tenantWorkspaceScopeRequired: true
  targetPlanRequiresApproval: true
  profileActivationRequiresApproval: true
  promotionRequiresReleaseDecision: true
  sourceClosureRequired: true
  noSilentProfileMutation: true
phaseMapping:
  alpha: [source-boundary, api-gateway-runtime, gateway-traffic-boundary, failure-diagnostics]
  beta: [test-and-quality, gateway-extension-boundary, observability, exception-tracking, slo-monitoring]
  rc: [gateway-traffic-boundary, gateway-extension-boundary, observability, slo-monitoring, operational-runbooks, release-governance]
  ga: [release-governance, gateway-traffic-boundary, gateway-extension-boundary, observability, slo-monitoring, source-boundary]
llmDraftPolicy:
  enabled: true
  generatedStatus: DRAFT
  requireUserReview: true
  activationRequiresAdmin: true
  allowedToSilentlyModifyActiveProfile: false
sourceReferences:
  - name: Envoy
    url: https://github.com/envoyproxy/envoy
    category: github
    rationale: Gateway and proxy traffic policy, xDS, filters, observability, and reliability reference.
  - name: Kong
    url: https://github.com/Kong/kong
    category: github
    rationale: API gateway routing, plugins, rate limiting, authentication, and operator experience reference.
  - name: Kubernetes Gateway API
    url: https://github.com/kubernetes-sigs/gateway-api
    category: github
    rationale: Gateway API route, listener, policy, and conformance model.
changelog:
  - version: 2.0.0
    changedAt: 2026-08-07T00:00:00.000Z
    changedBy: evopilot
    summary: Add v2 domain-first API gateway harness.
    changes:
      - Define compatibility, architecture, and runtime layers.
      - Require route, upstream, policy, plugin, protocol, and load evidence.
