schema: evopilot-project-harness-profile/v1
profileId: default
projectId: database-product
name: Database Product Harness Profile
description: Project-level profile for a self-developed database product.
template:
  templateId: database-product-harness
  version: 2.0.0
runtime:
  harnessLayer: domain
  domain: database-product
  language: generic
  compatibilityProfiles:
    - id: postgres-compatible
      role: compatibility-oracle
    - id: mysql-compatible
      role: compatibility-oracle
    - id: ansi-sql
      role: standards-baseline
  architectureProfiles:
    - id: distributed
  runtimeProfiles: [java, go, rust, cpp, generic]
  installCommands: [make deps]
  lintCommands: [make lint]
  typecheckCommands: [make build]
  unitCommands: [make test-unit]
  smokeCommands: [make smoke-sql]
  functionalCommands: [make test-sql-compat, make test-recovery, make test-upgrade]
validation:
  requiredCommandGroups: [install, lint, typecheck, unit, smoke, functional]
  contractChecks: [sql-compatibility, protocol-compatibility, transaction-isolation, crash-recovery, upgrade-compatibility]
evidence:
  requiredArtifacts: [target-evidence-package, sql-compatibility-report, differential-oracle-report, crash-recovery-log]
governance:
  profileActivationRequiresApproval: true
  promotionRequiresReleaseDecision: true
