schema: evopilot-harness-template/v1
id: database-product-harness
version: 2.0.0
name: Database Product Harness
description: Domain baseline for self-developed database products.
scope: platform
languageFamily: generic
capabilities:
  - id: source-boundary
    name: Source and workspace boundary
    boundary: Project source, credentials, tenant, workspace, branch, writeback, and read-only mode are explicit before execution.
    requiredEvidence: [project-registration, source-readiness-preflight, credential-or-read-only-boundary]
  - id: database-product-runtime
    name: Database product runtime harness
    boundary: Build, SQL compatibility, storage, transaction, recovery, upgrade, benchmark, and readiness commands are declared.
    requiredEvidence: [build-output, sql-compatibility-output, transaction-output, recovery-output, benchmark-output]
  - id: database-product-boundary
    name: Self-developed database product boundary
    boundary: The evolved project is the owner's database product; external databases are references and differential oracles only.
    requiredEvidence: [product-scope-declaration, reference-role-declaration, compatibility-corpus, differential-oracle-report]
  - id: sql-compatibility-boundary
    name: SQL compatibility boundary
    boundary: SQL grammar, dialect, protocol, type, transaction isolation, error code, and migration compatibility are versioned and tested.
    requiredEvidence: [sql-grammar-suite, dialect-compatibility-report, protocol-compatibility-report, error-code-map]
  - id: database-engine-correctness
    name: Database engine correctness
    boundary: Storage engine, query optimizer, transaction engine, replication, recovery, consistency, and durability behavior are proven.
    requiredEvidence: [storage-engine-test, optimizer-plan-proof, transaction-isolation-test, crash-recovery-test]
  - id: exception-tracking
    name: Exception and error tracking
    boundary: Runtime exceptions, domain errors, dependency failures, retries, and user-facing errors are classified and correlated.
    requiredEvidence: [error-code-contract, exception-sample, trace-link, owner-next-action, repair-verification]
  - id: test-and-quality
    name: Test and quality gates
    boundary: Tests, coverage expectations, interface contracts, and regression scope are proven through command evidence.
    requiredEvidence: [test-report, coverage-or-risk-acceptance, contract-check]
  - id: failure-diagnostics
    name: Failure diagnostics
    boundary: Failures are classified with command, stack/log excerpt, suspected root cause, owner, next action, and verification.
    requiredEvidence: [failure-classification, root-cause-note, repair-verification]
  - id: observability
    name: Observability
    boundary: Health, readiness, logs, metrics, traces, APM signals, and alert routes are bound before Beta/RC/GA claims.
    requiredEvidence: [health-check, runtime-log, metric-or-trace-proof, alert-route]
  - id: slo-monitoring
    name: SLO monitoring and alert routing
    boundary: SLIs, SLOs, dashboards, alert thresholds, routing targets, and error budget status are explicit before RC/GA.
    requiredEvidence: [sli-definition, slo-dashboard, alert-rule, runbook-link, error-budget-status]
  - id: operational-runbooks
    name: Operational runbooks
    boundary: Critical failure modes have symptom-first runbooks with triage queries, mitigation, rollback, owner, and verification.
    requiredEvidence: [runbook, triage-query, rollback-or-mitigation, oncall-owner, post-repair-verification]
  - id: release-governance
    name: Release governance
    boundary: TargetEvidencePackage, PhasePackage, source closure, release evidence, and ReleaseDecision are required before GA.
    requiredEvidence: [target-evidence-package, phase-package, source-closure, release-decision]
runtimePatterns:
  harnessLayer: domain
  domain: database-product
  domainLabel: Self-developed database product
  language: generic
  compatibilityProfiles:
    - id: postgres-compatible
      role: compatibility-oracle
      scope: [sql-dialect, wire-protocol, system-catalog, error-code]
      referenceProduct: PostgreSQL
    - id: mysql-compatible
      role: compatibility-oracle
      scope: [sql-dialect, wire-protocol, type-system, error-code]
      referenceProduct: MySQL
    - id: ansi-sql
      role: standards-baseline
      scope: [grammar, semantics, conformance]
  architectureProfiles:
    - id: single-node
      concerns: [storage-engine, query-engine, transaction-engine, backup-restore]
    - id: distributed
      concerns: [replication, sharding, consensus, failover, online-upgrade]
    - id: htap
      concerns: [oltp, olap, column-store, row-store, workload-isolation]
    - id: mpp
      concerns: [planner, executor, exchange, distributed-join, resource-governance]
  runtimeProfiles: [java, go, rust, cpp, generic]
  referenceBoundary:
    allowedRoles: [compatibility corpus, differential oracle, SQL dialect reference, protocol reference]
    forbiddenRoles: [default evolution target, silent upstream fork target, replace the owner's product]
  architectureStyles: [database-product, dbms, sql-engine, storage-engine, distributed-database, htap, mpp]
  defaultCommands:
    install: [make deps]
    lint: [make lint]
    typecheck: [make build]
    unit: [make test-unit]
    smoke: [make smoke-sql]
    functional: [make test-sql-compat, make test-recovery, make test-upgrade]
validationBaseline:
  requiredCommandGroups: [install, lint, typecheck, unit, smoke, functional]
  requiredBoundaries: [product-scope, sql-compatibility, storage-engine, query-engine, transaction-engine, recovery, performance, operations]
  contractChecks: [sql-compatibility, protocol-compatibility, transaction-isolation, crash-recovery, upgrade-compatibility, benchmark-regression]
  commandEvidenceRequired: true
  realBoundaryEvidenceRequired: true
  noMockEvidenceForReleaseClaims: true
  referenceProductsAreOraclesOnly: true
evidenceContract:
  format: json
  requiredArtifacts: [target-evidence-package, phase-package, goal-completion-report, sql-compatibility-report, differential-oracle-report, crash-recovery-log]
failureTaxonomy:
  categories: [sql, protocol, storage, transaction, replication, recovery, performance, observability, governance, unknown]
diagnosticsBaseline:
  requiredSignals: [failing-command, exit-code, sql-state, query-id, transaction-id, trace-id, recovery-log, benchmark-summary]
observabilityBaseline:
  requiredSignals: [health, readiness, logs, metrics, traces, alerts, dashboards, slo, runbooks]
governanceRules:
  tenantWorkspaceScopeRequired: true
  targetPlanRequiresApproval: true
  profileActivationRequiresApproval: true
  promotionRequiresReleaseDecision: true
  sourceClosureRequired: true
  noSilentProfileMutation: true
phaseMapping:
  alpha: [source-boundary, database-product-runtime, database-product-boundary, sql-compatibility-boundary, failure-diagnostics]
  beta: [test-and-quality, database-engine-correctness, observability, exception-tracking, slo-monitoring]
  rc: [database-engine-correctness, observability, slo-monitoring, operational-runbooks, release-governance, test-and-quality]
  ga: [release-governance, database-engine-correctness, observability, slo-monitoring, operational-runbooks, source-boundary]
llmDraftPolicy:
  enabled: true
  generatedStatus: DRAFT
  requireUserReview: true
  activationRequiresAdmin: true
  allowedToSilentlyModifyActiveProfile: false
sourceReferences:
  - name: PostgreSQL
    url: https://github.com/postgres/postgres
    category: github
    rationale: Compatibility reference and differential oracle; not the default evolution target.
  - name: MySQL Server
    url: https://github.com/mysql/mysql-server
    category: github
    rationale: Compatibility reference and differential oracle; not the default evolution target.
  - name: CockroachDB
    url: https://github.com/cockroachdb/cockroach
    category: github
    rationale: Distributed SQL consistency, replication, and recovery reference.
changelog:
  - version: 2.0.0
    changedAt: 2026-08-07T00:00:00.000Z
    changedBy: evopilot
    summary: Add v2 domain-first database product harness.
    changes:
      - Define compatibility, architecture, and runtime layers.
      - Treat PostgreSQL and MySQL as references and differential oracles only.
      - Require SQL compatibility, engine correctness, recovery, upgrade, and benchmark evidence.
