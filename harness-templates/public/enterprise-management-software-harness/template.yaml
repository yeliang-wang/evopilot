schema: evopilot-harness-template/v1
id: enterprise-management-software-harness
version: 2.0.0
name: Enterprise Management Software Harness
description: Domain baseline for CRM, ERP, workflow, and enterprise management products.
scope: platform
languageFamily: generic
capabilities:
  - id: source-boundary
    name: Source and workspace boundary
    boundary: Project source, credentials, tenant, workspace, branch, writeback, and read-only mode are explicit before execution.
    requiredEvidence: [project-registration, source-readiness-preflight, credential-or-read-only-boundary]
  - id: enterprise-management-runtime
    name: Enterprise management runtime harness
    boundary: API, UI, and backend job commands are declared with business workflow, permission, audit, report, integration, and data evidence.
    requiredEvidence: [api-output, ui-workflow-proof, rbac-output, audit-output, report-output, integration-output]
  - id: enterprise-domain-boundary
    name: Enterprise domain boundary
    boundary: Business objects, workflow states, approvals, permissions, audit events, integrations, and reporting rules are explicit.
    requiredEvidence: [domain-object-map, workflow-state-machine, rbac-matrix, audit-event-sample, integration-contract]
  - id: crm-erp-compatibility-boundary
    name: CRM/ERP compatibility boundary
    boundary: CRM, ERP, finance, inventory, customer lifecycle, import/export, and reporting behaviors are represented as compatibility profiles.
    requiredEvidence: [compatibility-profile, import-export-case, report-reconciliation, business-rule-test]
  - id: exception-tracking
    name: Exception and error tracking
    boundary: Runtime exceptions, domain errors, dependency failures, retries, and user-facing errors are classified and correlated.
    requiredEvidence: [error-code-contract, exception-sample, trace-link, owner-next-action, repair-verification]
  - id: test-and-quality
    name: Test and quality gates
    boundary: Tests, coverage expectations, interface contracts, and regression scope are proven through command evidence.
    requiredEvidence: [test-report, coverage-or-risk-acceptance, contract-check]
  - id: failure-diagnostics
    name: Failure diagnostics
    boundary: Failures are classified with command, stack/log excerpt, suspected root cause, owner, next action, and verification.
    requiredEvidence: [failure-classification, root-cause-note, repair-verification]
  - id: observability
    name: Observability
    boundary: Health, readiness, logs, metrics, traces, APM signals, and alert routes are bound before Beta/RC/GA claims.
    requiredEvidence: [health-check, runtime-log, metric-or-trace-proof, alert-route]
  - id: slo-monitoring
    name: SLO monitoring and alert routing
    boundary: SLIs, SLOs, dashboards, alert thresholds, routing targets, and error budget status are explicit before RC/GA.
    requiredEvidence: [sli-definition, slo-dashboard, alert-rule, runbook-link, error-budget-status]
  - id: operational-runbooks
    name: Operational runbooks
    boundary: Critical failure modes have symptom-first runbooks with triage queries, mitigation, rollback, owner, and verification.
    requiredEvidence: [runbook, triage-query, rollback-or-mitigation, oncall-owner, post-repair-verification]
  - id: release-governance
    name: Release governance
    boundary: TargetEvidencePackage, PhasePackage, source closure, release evidence, and ReleaseDecision are required before GA.
    requiredEvidence: [target-evidence-package, phase-package, source-closure, release-decision]
runtimePatterns:
  harnessLayer: domain
  domain: enterprise-management-software
  domainLabel: CRM/ERP/workflow management product
  language: generic
  compatibilityProfiles:
    - id: crm
      role: business-domain-profile
      scope: [customer, lead, opportunity, contract, service-ticket]
    - id: erp
      role: business-domain-profile
      scope: [order, inventory, procurement, finance, approval]
    - id: workflow
      role: business-domain-profile
      scope: [state-machine, approval, delegation, audit, sla]
  architectureProfiles:
    - id: modular-monolith
      concerns: [domain-modules, transaction-boundary, reporting, integration]
    - id: saas-control-plane
      concerns: [tenant, workspace, rbac, audit, quota]
    - id: evented-workflow
      concerns: [business-events, async-jobs, approval, integration]
  runtimeProfiles: [java, node, python, go, generic]
  architectureStyles: [enterprise-management-software, crm, erp, workflow-system, backoffice, business-platform]
  defaultCommands:
    install: [make install]
    lint: [make lint]
    typecheck: [make build]
    unit: [make test]
    smoke: [make smoke]
    functional: [make test:functional, make rbac-test, make workflow-test]
validationBaseline:
  requiredCommandGroups: [install, lint, typecheck, unit, smoke, functional]
  requiredBoundaries: [business-domain, rbac, workflow, audit, reporting, integration, data-import-export]
  contractChecks: [api-contract, rbac-matrix, workflow-state-machine, audit-trail, report-reconciliation, integration-contract]
  commandEvidenceRequired: true
  realBoundaryEvidenceRequired: true
  noMockEvidenceForReleaseClaims: true
evidenceContract:
  format: json
  requiredArtifacts: [target-evidence-package, phase-package, goal-completion-report, rbac-matrix, workflow-state-machine, audit-event-sample]
failureTaxonomy:
  categories: [business, permission, workflow, integration, report, import-export, observability, governance, unknown]
diagnosticsBaseline:
  requiredSignals: [failing-command, exit-code, business-object, record-id, actor-id, tenant-id, workflow-state, audit-event]
observabilityBaseline:
  requiredSignals: [health, readiness, logs, metrics, traces, alerts, dashboards, slo, runbooks]
governanceRules:
  tenantWorkspaceScopeRequired: true
  targetPlanRequiresApproval: true
  profileActivationRequiresApproval: true
  promotionRequiresReleaseDecision: true
  sourceClosureRequired: true
  noSilentProfileMutation: true
phaseMapping:
  alpha: [source-boundary, enterprise-management-runtime, enterprise-domain-boundary, failure-diagnostics]
  beta: [test-and-quality, crm-erp-compatibility-boundary, observability, exception-tracking, slo-monitoring]
  rc: [enterprise-domain-boundary, crm-erp-compatibility-boundary, observability, slo-monitoring, operational-runbooks, release-governance]
  ga: [release-governance, enterprise-domain-boundary, crm-erp-compatibility-boundary, observability, slo-monitoring, source-boundary]
llmDraftPolicy:
  enabled: true
  generatedStatus: DRAFT
  requireUserReview: true
  activationRequiresAdmin: true
  allowedToSilentlyModifyActiveProfile: false
sourceReferences:
  - name: ERPNext
    url: https://github.com/frappe/erpnext
    category: github
    rationale: Enterprise workflows, roles, document models, reports, and integration behavior reference.
  - name: Odoo
    url: https://github.com/odoo/odoo
    category: github
    rationale: ERP and CRM modularity, permissions, workflow, reporting, and integration reference.
  - name: SuiteCRM
    url: https://github.com/salesagility/SuiteCRM
    category: github
    rationale: CRM account, lead, opportunity, service, role, and workflow behavior reference.
changelog:
  - version: 2.0.0
    changedAt: 2026-08-07T00:00:00.000Z
    changedBy: evopilot
    summary: Add v2 domain-first enterprise management software harness.
    changes:
      - Define CRM, ERP, workflow, architecture, and runtime layers.
      - Require business object, RBAC, workflow, audit, report, integration, and import/export evidence.
