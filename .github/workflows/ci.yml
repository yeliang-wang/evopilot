name: Source and distribution checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install locked parent tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bind local public packages
        run: npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund ./projects/evopilot-runtime ./projects/evopilot-harness ./projects/evopilot-ontology
      - name: Install child dependencies
        run: |
          for product in runtime harness ontology; do
            npm --prefix "projects/evopilot-$product" ci --ignore-scripts --no-audit --no-fund
          done
      - name: Compile children before parent public imports
        run: |
          for product in runtime harness ontology; do
            npm --prefix "projects/evopilot-$product" run build
          done
      - run: npm run build
      - run: npm run check
      - name: Prepare locked native validators for the supported platform
        shell: bash
        run: |
          set -euo pipefail
          node -e "if(process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
          node dist/integration/toolchain/cli.js prepare --cache "$RUNNER_TEMP/evopilot-native-cache" > "$RUNNER_TEMP/native-toolchain.json"
          echo "EVOPILOT_TEST_NATIVE_TOOLCHAIN=$RUNNER_TEMP/native-toolchain.json" >> "$GITHUB_ENV"
      # Native validator subprocesses and large transport fixtures share the runner.
      # Execute the same complete test set with bounded worker contention.
      - name: Prepare credential-free synthetic Codex protocol configuration
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          // Protocol fixtures use a synthetic executable; no model or login is used.
          // Preserve the adapter's real configuration-path/digest admission checks.
          const directory = path.join(os.homedir(), '.codex');
          fs.mkdirSync(directory, { recursive: true, mode: 0o700 });
          fs.writeFileSync(path.join(directory, 'config.toml'),
            '# Synthetic CI protocol fixture only; contains no credentials.\n',
            { flag: 'wx', mode: 0o600 });
          JS
      - name: Full test suite with two workers
        run: node --test --test-concurrency=2 integration/e2e/*.test.mjs projects/evopilot-runtime/tests/e2e/*.test.mjs projects/evopilot-harness/tests/e2e/*.test.mjs projects/evopilot-ontology/tests/e2e/*.test.mjs
      - run: npm run artifacts:verify -- --out "$RUNNER_TEMP/evopilot-artifacts"
      - name: Assemble portable bundle
        run: node scripts/assemble-preview.mjs --artifacts "$RUNNER_TEMP/evopilot-artifacts" --out "$RUNNER_TEMP/evopilot-bundle"
      - name: Collect candidate distribution
        shell: bash
        run: |
          set -euo pipefail
          distribution="$RUNNER_TEMP/evopilot-distribution"
          mkdir "$distribution"
          tar -czf "$distribution/evopilot-0.8.1-preview.tar.gz" -C "$RUNNER_TEMP/evopilot-bundle" .
          for owner in runtime harness ontology; do
            mkdir "$distribution/$owner"
            tarballs=("$RUNNER_TEMP/evopilot-artifacts/$owner/"*.tgz)
            test "${#tarballs[@]}" -eq 1
            cp "${tarballs[0]}" "$distribution/$owner/"
            # Runtime has no dependencies and the verifier retains no lock for it.
            if [ "$owner" != runtime ]; then
              cp "$RUNNER_TEMP/evopilot-artifacts/$owner/dependency-lock.json" "$distribution/$owner/"
            fi
          done
          {
            git rev-parse HEAD
            git submodule status
          } > "$distribution/source-revision.txt"
          cd "$distribution"
          sha256sum evopilot-0.8.1-preview.tar.gz */*.tgz */dependency-lock.json source-revision.txt > SHA256SUMS
      - name: Upload candidate distribution (not an official Release)
        uses: actions/upload-artifact@v4
        with:
          name: evopilot-0.8.1-preview-${{ github.sha }}
          path: ${{ runner.temp }}/evopilot-distribution/
          retention-days: 14
          if-no-files-found: error

