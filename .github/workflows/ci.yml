name: Local assembly checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install child dependencies
        run: |
          for product in harness ontology; do
            npm --prefix "projects/evopilot-$product" ci --ignore-scripts --no-audit --no-fund
          done
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run artifacts:verify -- --out "$RUNNER_TEMP/evopilot-artifacts"

