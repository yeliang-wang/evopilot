name: Promote Accepted Candidate to npm

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "GitHub Actions run id that formed the accepted Candidate"
        required: true
        type: string
      candidate_commit:
        description: "Exact 40-character Candidate commit"
        required: true
        type: string
      version:
        description: "Accepted Candidate version without v prefix"
        required: true
        type: string
      target_id:
        description: "Approved Evolution Target id"
        required: true
        type: string
      candidate_handoff_sha256:
        description: "sha256 digest of the accepted Candidate handoff"
        required: true
        type: string
      acceptance_digest:
        description: "sha256 digest of final acceptance evidence"
        required: true
        type: string
      github_release_authorization_digest:
        description: "sha256 digest that authorized the already published GitHub Release"
        required: true
        type: string
      release_authorization_digest:
        description: "sha256 digest of the separate npm publication authorization"
        required: true
        type: string

concurrency:
  group: promote-accepted-candidate-npm-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish accepted npm tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      TARGET_ID: ${{ inputs.target_id }}
      HANDOFF_DIGEST: ${{ inputs.candidate_handoff_sha256 }}
      ACCEPTANCE_DIGEST: ${{ inputs.acceptance_digest }}
      GITHUB_RELEASE_AUTHORIZATION_DIGEST: ${{ inputs.github_release_authorization_digest }}
      NPM_PUBLICATION_AUTHORIZATION_DIGEST: ${{ inputs.release_authorization_digest }}
    steps:
      - name: Initialize runner paths
        run: |
          echo "CANDIDATE_DIR=$RUNNER_TEMP/evopilot-candidate/release" >> "$GITHUB_ENV"
          echo "HANDOFF_DIR=$RUNNER_TEMP/evopilot-candidate/handoff" >> "$GITHUB_ENV"

      - name: Validate immutable bindings
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$TARGET_ID" =~ ^[a-z0-9][a-z0-9.-]*$ ]]
          [[ "$HANDOFF_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ACCEPTANCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$GITHUB_RELEASE_AUTHORIZATION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$NPM_PUBLICATION_AUTHORIZATION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Checkout promotion mechanics from workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node for npm provenance
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Validate version, Roadmap, and public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test -f "governance/targets/$TARGET_ID.json"
          npm run roadmap:release -- "$VERSION"
          npm run verify:release-pipeline
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"

          TARGET_RECORD="$RUNNER_TEMP/evopilot-npm-release-target.json"
          gh api -X GET "repos/$GITHUB_REPOSITORY/contents/governance/targets/$TARGET_ID.json" \
            -f ref="$GITHUB_SHA" --jq .content | base64 --decode > "$TARGET_RECORD"
          node - "$TARGET_RECORD" "$NPM_PUBLICATION_AUTHORIZATION_DIGEST" "$VERSION" <<'NODE'
          const fs = require("node:fs");
          const [targetPath, authorizationDigest, version] = process.argv.slice(2);
          const target = JSON.parse(fs.readFileSync(targetPath, "utf8"));
          if (target.approvals?.release?.authorizationDigest !== authorizationDigest) {
            throw new Error("Target npm publication authorization digest mismatch");
          }
          if (!target.release?.actions?.includes("npm")) {
            throw new Error("Target does not authorize npm");
          }
          if (target.release?.versions?.evopilot !== version) {
            throw new Error("Target npm publication version mismatch");
          }
          NODE

      - name: Download exact Candidate release set
        uses: actions/download-artifact@v4
        with:
          name: evopilot-${{ inputs.version }}-candidate-release-set
          path: ${{ env.CANDIDATE_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Download exact Candidate handoff
        uses: actions/download-artifact@v4
        with:
          name: evopilot-${{ inputs.version }}-candidate-handoff
          path: ${{ env.HANDOFF_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify accepted Candidate without rebuilding
        run: |
          set -euo pipefail
          HANDOFF="$HANDOFF_DIR/evopilot-$VERSION-project-candidate-handoff.json"
          node scripts/project-candidate-handoff.mjs verify \
            --handoff "$HANDOFF" \
            --handoff-digest "$HANDOFF_DIGEST" \
            --release-dir "$CANDIDATE_DIR" \
            --source-checkout "$GITHUB_WORKSPACE" \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$CANDIDATE_COMMIT" \
            --run-id "$CANDIDATE_RUN_ID" \
            --target-id "$TARGET_ID"
          node scripts/verify-release-artifacts.mjs "$CANDIDATE_DIR"

      - name: Verify GitHub Release promotion binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RECORD_DIR="$RUNNER_TEMP/evopilot-release-record"
          mkdir -p "$RECORD_DIR"
          gh release download "$RELEASE_TAG" --pattern "evopilot-$VERSION-release-promotion.json" --dir "$RECORD_DIR"
          node scripts/release-promotion-record.mjs verify \
            --record "$RECORD_DIR/evopilot-$VERSION-release-promotion.json" \
            --handoff "$HANDOFF_DIR/evopilot-$VERSION-project-candidate-handoff.json" \
            --version "$VERSION" \
            --target-id "$TARGET_ID" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --handoff-digest "$HANDOFF_DIGEST" \
            --acceptance-digest "$ACCEPTANCE_DIGEST" \
            --release-authorization-digest "$GITHUB_RELEASE_AUTHORIZATION_DIGEST" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/release-artifacts.yml"

      - name: Publish accepted tarballs in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          REGISTRY="https://registry.npmjs.org/"

          publish_or_verify() {
            local package_name="$1"
            local tarball="$2"
            local provenance_mode="$3"
            local expected_integrity
            local actual_integrity
            local error_file="$RUNNER_TEMP/npm-view-error.log"

            expected_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
            if actual_integrity="$(npm view "${package_name}@${VERSION}" dist.integrity --registry "$REGISTRY" 2>"$error_file")"; then
              test "$actual_integrity" = "$expected_integrity" || {
                echo "Existing ${package_name}@${VERSION} integrity does not match the accepted tarball" >&2
                exit 1
              }
              echo "Verified existing ${package_name}@${VERSION}; publication mutation skipped"
              return
            fi

            if ! grep -q "E404" "$error_file"; then
              echo "Registry lookup for ${package_name}@${VERSION} failed without an authoritative not-found result" >&2
              exit 1
            fi

            case "$provenance_mode" in
              required)
                npm publish "$tarball" --access public --provenance --registry "$REGISTRY"
                ;;
              approved-v4-adapter-exception)
                npm publish "$tarball" --access public --provenance=false --registry "$REGISTRY"
                ;;
              *)
                echo "Unknown provenance mode for ${package_name}: ${provenance_mode}" >&2
                exit 1
                ;;
            esac
          }

          adapter_provenance_mode() {
            if [[ "$VERSION" == "4.0.0" ]]; then
              echo "approved-v4-adapter-exception"
            else
              echo "required"
            fi
          }

          ADAPTER_PROVENANCE_MODE="$(adapter_provenance_mode)"

          publish_or_verify "@evopilot/contracts" "$CANDIDATE_DIR/evopilot-contracts-${VERSION}.tgz" required
          publish_or_verify "@evopilot/client" "$CANDIDATE_DIR/evopilot-client-${VERSION}.tgz" required
          publish_or_verify "@evopilot/adapter-mcp" "$CANDIDATE_DIR/evopilot-adapter-mcp-${VERSION}.tgz" "$ADAPTER_PROVENANCE_MODE"
          publish_or_verify "@evopilot/adapter-opencode" "$CANDIDATE_DIR/evopilot-adapter-opencode-${VERSION}.tgz" "$ADAPTER_PROVENANCE_MODE"
          publish_or_verify "@evopilot/cli" "$CANDIDATE_DIR/evopilot-cli-${VERSION}.tgz" required
          publish_or_verify "create-evopilot" "$CANDIDATE_DIR/create-evopilot-${VERSION}.tgz" required

      - name: Verify public npm registry from an empty project
        run: |
          set -euo pipefail
          REGISTRY="https://registry.npmjs.org/"
          npm run verify:npm-registry -- --version "$VERSION" --wait --timeout-ms 300000 --interval-ms 15000

          verify_public_package() {
            local package_name="$1"
            local tarball="$2"
            local provenance_mode="$3"
            local expected_integrity
            local actual_integrity
            local attestation_url

            expected_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
            actual_integrity="$(npm view "${package_name}@${VERSION}" dist.integrity --registry "$REGISTRY")"
            test "$actual_integrity" = "$expected_integrity"
            attestation_url="$(npm view "${package_name}@${VERSION}" dist.attestations.url --registry "$REGISTRY")"
            case "$provenance_mode" in
              required)
                test -n "$attestation_url"
                ;;
              approved-v4-adapter-exception)
                test -z "$attestation_url"
                ;;
              *)
                exit 1
                ;;
            esac
          }

          adapter_provenance_mode() {
            if [[ "$VERSION" == "4.0.0" ]]; then
              echo "approved-v4-adapter-exception"
            else
              echo "required"
            fi
          }

          ADAPTER_PROVENANCE_MODE="$(adapter_provenance_mode)"

          verify_public_package "@evopilot/contracts" "$CANDIDATE_DIR/evopilot-contracts-${VERSION}.tgz" required
          verify_public_package "@evopilot/client" "$CANDIDATE_DIR/evopilot-client-${VERSION}.tgz" required
          verify_public_package "@evopilot/adapter-mcp" "$CANDIDATE_DIR/evopilot-adapter-mcp-${VERSION}.tgz" "$ADAPTER_PROVENANCE_MODE"
          verify_public_package "@evopilot/adapter-opencode" "$CANDIDATE_DIR/evopilot-adapter-opencode-${VERSION}.tgz" "$ADAPTER_PROVENANCE_MODE"
          verify_public_package "@evopilot/cli" "$CANDIDATE_DIR/evopilot-cli-${VERSION}.tgz" required
          verify_public_package "create-evopilot" "$CANDIDATE_DIR/create-evopilot-${VERSION}.tgz" required

          SIGNATURE_DIR="$RUNNER_TEMP/evopilot-npm-signatures"
          mkdir -p "$SIGNATURE_DIR"
          cd "$SIGNATURE_DIR"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --registry "$REGISTRY" \
            "@evopilot/contracts@${VERSION}" \
            "@evopilot/client@${VERSION}" \
            "@evopilot/adapter-mcp@${VERSION}" \
            "@evopilot/adapter-opencode@${VERSION}" \
            "@evopilot/cli@${VERSION}" \
            "create-evopilot@${VERSION}"
          npm audit signatures --registry "$REGISTRY"
