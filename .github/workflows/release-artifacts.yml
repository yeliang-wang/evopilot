name: Promote Accepted Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "GitHub Actions run id that formed the accepted Candidate"
        required: true
        type: string
      candidate_commit:
        description: "Exact 40-character Candidate commit"
        required: true
        type: string
      version:
        description: "Accepted Candidate version without v prefix"
        required: true
        type: string
      target_id:
        description: "Approved Evolution Target id"
        required: true
        type: string
      candidate_handoff_sha256:
        description: "sha256 digest of the accepted Candidate handoff"
        required: true
        type: string
      acceptance_digest:
        description: "sha256 digest of final acceptance evidence"
        required: true
        type: string
      release_authorization_digest:
        description: "sha256 digest of the separate Release Binding authorization"
        required: true
        type: string

concurrency:
  group: promote-accepted-candidate-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  promote:
    name: Promote accepted bytes to GitHub Release and GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      CANDIDATE_DIR: ${{ runner.temp }}/evopilot-candidate/release
      HANDOFF_DIR: ${{ runner.temp }}/evopilot-candidate/handoff
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/evopilot
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      TARGET_ID: ${{ inputs.target_id }}
      HANDOFF_DIGEST: ${{ inputs.candidate_handoff_sha256 }}
      ACCEPTANCE_DIGEST: ${{ inputs.acceptance_digest }}
      RELEASE_AUTHORIZATION_DIGEST: ${{ inputs.release_authorization_digest }}
    steps:
      - name: Validate immutable bindings
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$TARGET_ID" =~ ^[a-z0-9][a-z0-9.-]*$ ]]
          [[ "$HANDOFF_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ACCEPTANCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RELEASE_AUTHORIZATION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Checkout verifier and release notes from Candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false

      - name: Validate version and Roadmap release boundary
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test -f "governance/targets/$TARGET_ID.json"
          npm run roadmap:release -- "$VERSION"
          npm run verify:release-pipeline

      - name: Download exact Candidate release set
        uses: actions/download-artifact@v4
        with:
          name: evopilot-${{ inputs.version }}-candidate-release-set
          path: ${{ env.CANDIDATE_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Download exact Candidate handoff
        uses: actions/download-artifact@v4
        with:
          name: evopilot-${{ inputs.version }}-candidate-handoff
          path: ${{ env.HANDOFF_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify accepted Candidate without rebuilding
        run: |
          set -euo pipefail
          HANDOFF="$HANDOFF_DIR/evopilot-$VERSION-project-candidate-handoff.json"
          node scripts/project-candidate-handoff.mjs verify \
            --handoff "$HANDOFF" \
            --handoff-digest "$HANDOFF_DIGEST" \
            --release-dir "$CANDIDATE_DIR" \
            --source-checkout "$GITHUB_WORKSPACE" \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$CANDIDATE_COMMIT" \
            --run-id "$CANDIDATE_RUN_ID" \
            --target-id "$TARGET_ID"
          node scripts/verify-release-artifacts.mjs "$CANDIDATE_DIR"

      - name: Ensure release destination is unused
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; accepted assets will not be overwritten"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists; force retagging is forbidden"
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote accepted image archive without rebuild
        run: |
          set -euo pipefail
          docker load --input "$CANDIDATE_DIR/evopilot-$VERSION-container-image.tar"
          docker tag "$IMAGE_REPOSITORY:$VERSION" "$IMAGE_REPOSITORY:$CANDIDATE_COMMIT"
          docker push "$IMAGE_REPOSITORY:$CANDIDATE_COMMIT"
          docker push "$IMAGE_REPOSITORY:$VERSION"

      - name: Create draft Release and upload accepted assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE="docs/releases/$VERSION.md"
          test -f "$NOTES_FILE"
          PROMOTION_RECORD="$RUNNER_TEMP/evopilot-$VERSION-release-promotion.json"
          HANDOFF="$HANDOFF_DIR/evopilot-$VERSION-project-candidate-handoff.json"
          node scripts/release-promotion-record.mjs build \
            --handoff "$HANDOFF" \
            --output "$PROMOTION_RECORD" \
            --version "$VERSION" \
            --target-id "$TARGET_ID" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-commit "$CANDIDATE_COMMIT" \
            --handoff-digest "$HANDOFF_DIGEST" \
            --acceptance-digest "$ACCEPTANCE_DIGEST" \
            --release-authorization-digest "$RELEASE_AUTHORIZATION_DIGEST" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/release-artifacts.yml" \
            --promotion-run-id "$GITHUB_RUN_ID" \
            --promotion-run-attempt "$GITHUB_RUN_ATTEMPT"
          gh release create "$RELEASE_TAG" \
            --draft \
            --title "EvoPilot $RELEASE_TAG" \
            --notes-file "$NOTES_FILE" \
            --target "$CANDIDATE_COMMIT"
          mapfile -t ASSETS < <(find "$CANDIDATE_DIR" -maxdepth 1 -type f -print | sort)
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" "$PROMOTION_RECORD"
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify public Release and immutable image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"
          PUBLIC_DIR="$RUNNER_TEMP/evopilot-public-release"
          mkdir -p "$PUBLIC_DIR"
          gh release download "$RELEASE_TAG" --dir "$PUBLIC_DIR"
          node scripts/verify-release-artifacts.mjs "$PUBLIC_DIR"
          EXPECTED_IMAGE_DIGEST="$(node -p "require('$CANDIDATE_DIR/evopilot-$VERSION-image-metadata.json').imageDigest")"
          ACTUAL_IMAGE_DIGEST="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$VERSION" | awk '/^Digest:/ {print $2; exit}')"
          test "$ACTUAL_IMAGE_DIGEST" = "$EXPECTED_IMAGE_DIGEST"
