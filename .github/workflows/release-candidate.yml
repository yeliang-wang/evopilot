name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit to build once"
        required: true
        type: string
      target_id:
        description: "Approved Evolution Target id"
        required: true
        type: string

concurrency:
  group: release-candidate-${{ inputs.commit_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build immutable Candidate release set
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.boundary.outputs.version }}
      target_revision: ${{ steps.boundary.outputs.target_revision }}
      target_authorization_digest: ${{ steps.boundary.outputs.target_authorization_digest }}
      artifact_name: ${{ steps.boundary.outputs.artifact_name }}
      # upload-artifact exposes the digest body; the handoff contract requires
      # an algorithm-qualified digest.
      artifact_digest: "sha256:${{ steps.release_set.outputs.artifact-digest }}"
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/evopilot
      TARGET_FILE: governance/targets/${{ inputs.target_id }}.json
      TARGET_ID: ${{ inputs.target_id }}
      CANDIDATE_COMMIT: ${{ inputs.commit_sha }}
    steps:
      - name: Validate exact commit input
        run: |
          set -euo pipefail
          if ! [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be an exact 40-character lowercase Git commit"
            exit 1
          fi
          if ! [[ "$TARGET_ID" =~ ^[a-z0-9][a-z0-9.-]*$ ]]; then
            echo "::error::target_id contains an unsafe character"
            exit 1
          fi

      - name: Checkout exact Candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Bind version and approved Target
        id: boundary
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$CANDIDATE_COMMIT"
          test -f "$TARGET_FILE"
          VERSION="$(node -p "require('./package.json').version")"
          TARGET_STATUS="$(node -p "require('./$TARGET_FILE').status")"
          TARGET_VERSION="$(node -p "require('./$TARGET_FILE').roadmapBindings[0].targetVersion")"
          TARGET_REVISION="$(node -p "require('./$TARGET_FILE').revision")"
          TARGET_AUTHORIZATION_DIGEST="$(node -p "require('./$TARGET_FILE').approvals.target.authorizationDigest")"
          test "$TARGET_STATUS" = "APPROVED"
          test "$TARGET_VERSION" = "$VERSION"
          test -n "$TARGET_AUTHORIZATION_DIGEST"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_revision=$TARGET_REVISION" >> "$GITHUB_OUTPUT"
          echo "target_authorization_digest=$TARGET_AUTHORIZATION_DIGEST" >> "$GITHUB_OUTPUT"
          echo "artifact_name=evopilot-$VERSION-candidate-release-set" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Full repository verification
        run: npm run check

      - name: Release readiness and Roadmap alignment
        run: |
          npm run release:ready
          npm run roadmap:release -- "$VERSION"
          npm run verify:release-pipeline

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Candidate image archive without publication
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=EvoPilot
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Docker's loadable archive exporter cannot retain registry attestations.
          # The release set carries its own SPDX SBOM and provenance documents.
          provenance: false
          sbom: false
          outputs: type=docker,dest=${{ runner.temp }}/evopilot-container-image.tar

      - name: Build release set once
        env:
          EVOPILOT_IMAGE_REF: ${{ env.IMAGE_REPOSITORY }}:${{ env.VERSION }}
          EVOPILOT_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          EVOPILOT_IMAGE_ARCHIVE: ${{ runner.temp }}/evopilot-container-image.tar
        # GITHUB_* variables cannot be overridden through workflow env. Bind the
        # synthetic Candidate tag directly on the artifact-builder process.
        run: GITHUB_REF_NAME="$RELEASE_TAG" npm run release:artifact

      - name: Verify built release set
        run: npm run verify:release-artifact

      - name: Upload controlled Candidate release set
        id: release_set
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.boundary.outputs.artifact_name }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  handoff:
    name: Fresh-materialize and bind Candidate handoff
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_FILE: governance/targets/${{ inputs.target_id }}.json
      TARGET_ID: ${{ inputs.target_id }}
      CANDIDATE_COMMIT: ${{ inputs.commit_sha }}
    steps:
      - name: Checkout verifier from exact Candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Download exact Candidate release set outside checkout
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/evopilot-candidate/release

      - name: Verify fresh Candidate materialization
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/evopilot-candidate/release
        run: node scripts/verify-release-artifacts.mjs "$CANDIDATE_DIR"

      - name: Build and verify Candidate handoff
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/evopilot-candidate/release
          HANDOFF_DIR: ${{ runner.temp }}/evopilot-candidate/handoff
          TARGET_AUTHORIZATION_DIGEST: ${{ needs.build.outputs.target_authorization_digest }}
          TARGET_REVISION: ${{ needs.build.outputs.target_revision }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p "$HANDOFF_DIR"
          WORKFLOW_DIGEST="sha256:$(sha256sum .github/workflows/release-candidate.yml | cut -d' ' -f1)"
          HANDOFF="$HANDOFF_DIR/evopilot-$VERSION-project-candidate-handoff.json"
          node scripts/project-candidate-handoff.mjs build \
            --release-dir "$CANDIDATE_DIR" \
            --source-checkout "$GITHUB_WORKSPACE" \
            --output "$HANDOFF" \
            --target-path "$TARGET_FILE" \
            --target-id "$TARGET_ID" \
            --target-revision "$TARGET_REVISION" \
            --target-authorization-digest "$TARGET_AUTHORIZATION_DIGEST" \
            --version "$VERSION" \
            --commit "$CANDIDATE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow ".github/workflows/release-candidate.yml" \
            --workflow-digest "$WORKFLOW_DIGEST" \
            --ref "$GITHUB_REF" \
            --artifact-name "${{ needs.build.outputs.artifact_name }}" \
            --channel-artifact-digest "$CHANNEL_ARTIFACT_DIGEST" \
            --retention-days 30
          node scripts/project-candidate-handoff.mjs verify \
            --handoff "$HANDOFF" \
            --release-dir "$CANDIDATE_DIR" \
            --source-checkout "$GITHUB_WORKSPACE" \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$CANDIDATE_COMMIT" \
            --run-id "$GITHUB_RUN_ID" \
            --target-id "$TARGET_ID"
          sha256sum "$HANDOFF"

      - name: Upload Candidate handoff
        uses: actions/upload-artifact@v4
        with:
          name: evopilot-${{ needs.build.outputs.version }}-candidate-handoff
          path: ${{ runner.temp }}/evopilot-candidate/handoff/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
