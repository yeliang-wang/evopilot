name: Release Ready

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify release readiness gates
        run: npm run release:ready

      - name: Upload release readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evopilot-release-ready
          path: dist/test-matrix/release-ready.json
          if-no-files-found: ignore
