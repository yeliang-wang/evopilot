      "Harness-independent Lifecycle-only Goal Target Loop execution",
      "general-purpose Agent session runtime, model or tool loop, or coding-Agent workspace implementation",
      "Host-specific lifecycle, Harness-selection, approval, or recovery semantics",
      "exclusive dependence on one Agent Host, Agent Runtime, or model provider",
      "model training implementation"
    ]
  },
  "versionPolicy": {
    "runtimeProduct": "evopilot-runtime",
    "publishedBaseline": "5.0.0",
    "currentWorkingVersion": "5.0.1",
    "versionsEvolveIndependently": true,
    "majorRequiredFor": [
      "incompatible published Harness consumption contract",
      "replacement of an accepted product boundary",
      "incompatible Project Definition, Lifecycle, Human Interaction, Host, Runtime, acceptance, or release contract",
      "replacement of the Harness-guided Goal Target Loop core"
    ]
  },
  "projectDefinitionPolicy": {
    "aggregateRoot": "EvolutionProjectDefinition",
    "format": "human-readable YAML with published schema and deterministic canonical form",
    "composes": [
      "SoftwareArchetype",
      "CapabilityPack",
      "LifecycleModule",
      "PolicyPack",
      "ProviderBinding",
      "EnvironmentBinding",
      "SecretRef",
      "HumanAuthorityRole"
    ],
    "rules": [
      "project-specific values are discovered facts, typed inputs, approved defaults, or SecretRefs rather than Engine branches",
      "active runs bind immutable resolved definitions and cannot drift after later edits",
      "every revision has a semantic diff, compatibility result, impact preview, digest, migration result, and rollback point",
      "a materially different project onboards through declarations and catalog composition with zero Engine source diff",
      "project domain types must not collide with evopilot-harness HarnessProfile or HarnessBundle asset types"
    ]
  },
  "harnessGuidedExecutionPolicy": {
    "mode": "HARNESS_GUIDED_GOAL_TARGET_LOOP",
    "requiredForGoalTargetLoop": true,
    "publishedAssetsReadOnly": true,
    "matchingInputs": ["versioned EvolutionProjectDefinition", "exact GoalTarget"],
    "matchingReads": ["published HarnessProfile metadata", "classification", "positive concepts", "negative concepts", "boundaries", "capabilities", "compatibility", "Catalog priority"],
    "executionRequires": [
      "one eligible published immutable HarnessBundle",
      "pinned HarnessProfile and required HarnessComponent versions and digests",
      "pinned execution plan, constraints, required evidence, validators, and capabilities",
      "one resolved immutable Lifecycle and Policy closure",
      "one exact project, GoalTarget, Provider, Environment, Host, Runtime, and authority closure"
    ],
    "binding": "HarnessExecutionBinding",
    "perIterationRevalidation": true,
    "lifecycleMayReplaceHarness": false,
    "lifecycleMayWeakenHarness": false,
    "composition": "intersect permitted effects and union required obligations",
    "conflictPriority": [
      "non-bypassable safety and current authority",
      "tenant, workspace, project, credential, environment, and provider restrictions",
      "published HarnessBundle constraints, validators, required evidence, and capabilities",
      "resolved Lifecycle orchestration, automation, recovery, Candidate, acceptance, release, and rollback rules",
      "qualified Runtime and Host capabilities"
    ],
    "catalogEvolution": [
      "unrelated additive Catalog growth is accepted when the bound Asset closure remains unchanged",
      "changed, removed, unpublished, invalid, or incompatible bound Assets block before the next mutation",
      "existing plans and runs are never rewritten by newly published Harness versions",
      "new Harness versions enter only a new plan or explicit governed migration"
    ],
    "noMatch": "deterministic abstention and private redacted Harness-gap feedback; no generic fallback",
    "ambiguity": "present exact alternatives and require one project-meaning decision rather than guessing"
  },
  "lifecycleHarnessPolicy": {
    "mode": "OPEN_DECLARATIVE_LIFECYCLE_AROUND_HARNESS",
    "definitionFormat": "human-readable YAML with apiVersion, kind, metadata, and spec",
    "graphModel": "open stage graph with imports and composition",
    "executionModel": "closed versioned Action and Capability Registry",
    "bindingRule": "every run binds one immutable resolved LifecycleRevision plus exact input, policy, action, HarnessExecutionBinding, runtime, project, and GoalTarget digests",
    "inputCollection": {
      "schemaDriven": true,
      "ordinaryHumanEntry": "question-driven conversation through a compatible independently installed Evolution Expert",
      "headlessEntry": "the same schema accepts explicit YAML or JSON through CLI, API, or CI",
      "sources": [
        "project discovery",
        "Organization defaults",
        "Lifecycle defaults",
        "Harness requirements",
        "Runtime capability discovery",
        "interactive user answers",
        "deterministic derivation",
        "external SecretRef"
      ],
      "rules": [
        "discover and validate before asking",
        "ask only unresolved relevant inputs and show detected or default values",
        "input collection is not approval or authority",
        "raw secrets are never requested or stored in project or Lifecycle YAML",
        "the final binding is immutable and digest-bound",
        "one schema drives Expert, UI, MCP, CLI, API, CI, validation, and final review"
      ]
    },
    "decisionModes": ["AUTO", "POLICY", "HUMAN", "EXTERNAL_SIGNAL", "DISABLED"],
    "automationPolicy": {
      "default": "AUTO_WHEN_DETERMINISTIC_REVERSIBLE_BOUNDED_AND_WITHIN_CURRENT_AUTHORITY",
      "humanDecisionRequiredFor": [
        "product or project meaning not supplied by an exact current decision",
        "irreversible, destructive, or externally visible effects",
        "production or database access, credential use, or authority expansion",
        "Candidate acceptance, project publication, or Release",
        "policy exception, material matching ambiguity, unresolved risk, changed-state ambiguity, or exhausted bounded recovery",
        "one-time activation of a new reusable Automation Registry class"
      ],
      "mustAutomate": [
        "schema, policy, source, architecture, Roadmap, Target, compatibility, and binding validation",
        "build, test, smoke, evaluation, soak orchestration, integrity checks, and evidence capture",
        "deterministic repository hygiene and workflow-mechanics repair within approved scope",
        "deterministic aggregation, receipt reconciliation, duplicate suppression, safe resume, and safe identical-input retry",
        "active Automation Registry rules whose match, verification, budget, authority, and expiry still hold"
      ],
      "continuation": "one digest-bound authorization may cover the unchanged bounded plan and all declared automatic stages",
      "drift": "only a relevant immutable binding change invalidates the affected authorization"
    },
    "separationRules": [
      "parameters are not decisions",
      "readiness is not authority",
      "conversation continuation is not approval",
      "Lifecycle definition and runtime status are separate",
      "Lifecycle YAML cannot embed arbitrary executable shell, programming-language code, raw secrets, or hidden authority",
      "Lifecycle cannot remove a required Harness validator, evidence obligation, constraint, boundary, or capability requirement"
    ],
    "referenceDefinitions": [
      "DataRig enterprise-internal delivery",
      "EvoPilot GitHub open-source release",
      "evopilot-harness public open-source producer release",
      "Alpha Beta RC GA compatibility only"
    ]
  },
  "recoveryPolicy": {
    "mode": "BOUNDED_SELF_HEALING_AND_GOVERNED_LEARNING",
    "automatic": ["classify", "reconcile", "repair", "retry", "resume", "verify", "rollback when declared"],
    "automationRegistry": {
      "proposalWhenUnknownSafeClass": true,
      "approvalBinds": ["match conditions", "action", "verification", "retry budget", "rollback", "authority", "expiry", "suspension"],
      "futureExactMatchesAutomatic": true,
      "verificationFailureSuspendsRule": true
    },
    "mustNotDo": ["expand authority", "repeat an uncertain mutation", "hide changed state", "convert business ambiguity into a technical repair"]
  },
