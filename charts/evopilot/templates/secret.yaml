{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "evopilot.secretName" . }}
  labels:
    {{- include "evopilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  EVOPILOT_TOKENS: {{ .Values.auth.tokens | quote }}
  EVOPILOT_USERS: {{ .Values.auth.users | quote }}
  {{- if .Values.postgres.enabled }}
  EVOPILOT_POSTGRES_PASSWORD: "change-me-postgres-password"
  {{- else }}
  EVOPILOT_LOOP_STORE_DSN: {{ required "postgres.externalDsn is required when postgres.enabled=false" .Values.postgres.externalDsn | quote }}
  {{- end }}
  EVOPILOT_LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
{{- end }}
