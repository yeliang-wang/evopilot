image:
  repository: ghcr.io/yeliang-wang/evopilot
  tag: "1.1.2"
  pullPolicy: IfNotPresent

dashboard:
  enabled: true
  image:
    repository: ghcr.io/yeliang-wang/evopilot-dashboard
    tag: "1.0.8"
    pullPolicy: IfNotPresent

auth:
  existingSecret: evopilot-prod-secrets
  tokens: ""
  users: ""

llm:
  providerName: openai-compatible
  baseUrl: https://llm.internal.example/v1
  modelName: production-model
  apiKey: ""
  requireLlm: true

postgres:
  enabled: true
  database: evopilot
  user: evopilot
  storage:
    size: 50Gi

persistence:
  enabled: true
  size: 100Gi

runtime:
  runMode: prod
  logLevel: info
  loopWorkerId: evopilot-production-worker
  hostWorkspaceMount: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: evopilot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
