nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/yeliang-wang/evopilot
  tag: "2.0.0"
  pullPolicy: IfNotPresent

dashboard:
  enabled: true
  image:
    repository: ghcr.io/yeliang-wang/evopilot-dashboard
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    extraPorts: []

postgres:
  enabled: true
  externalDsn: ""
  image:
    repository: docker.m.daocloud.io/library/postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: evopilot
  user: evopilot
  service:
    port: 5432
  storage:
    size: 8Gi

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: ""

service:
  type: ClusterIP
  apiPort: 19876
  codeUpgraderPort: 3000
  extraPorts: []

auth:
  existingSecret: ""
  tokens: "admin:change-me-admin-token:admin,operator:change-me-operator-token:operator,viewer:change-me-viewer-token:viewer"
  users: "admin:change-me-admin-password:admin:tenant-production:workspace-agent-products:PlatformAdmin"

llm:
  providerName: openai-compatible
  baseUrl: https://llm.example.com/v1
  modelName: replace-with-model
  apiKey: replace-with-server-side-secret
  requireLlm: true

runtime:
  dataRoot: /var/lib/evopilot
  runMode: prod
  logLevel: info
  loopWorkerId: evopilot-helm-worker
  hostWorkspaceMount: ""

resources: {}

podSecurityContext: {}
securityContext: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: evopilot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

EVOPILOT_TOKENS: "set through auth.tokens or auth.existingSecret"
